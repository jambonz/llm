name: check-bedrock-models

# Weekly Bedrock manifest drift check. Compares src/adapters/bedrock/manifest.ts
# against AWS's live lifecycle data; opens a PR if any model is now LEGACY but
# not yet flagged deprecated.
#
# AWS access is via GitHub OIDC — no long-lived keys are stored in this
# public repo. One-time setup, in the AWS account that should be queried:
#
#   1. Register GitHub as an OIDC provider:
#        Provider URL: https://token.actions.githubusercontent.com
#        Audience:     sts.amazonaws.com
#   2. Create a role trusted by that provider, restricted to this repo:
#        "token.actions.githubusercontent.com:sub":
#          "repo:jambonz/llm:ref:refs/heads/main"
#   3. Attach an inline policy allowing only (both read-only, no model data
#      is accessed):
#        - bedrock:ListFoundationModels
#        - bedrock:ListInferenceProfiles
#   4. Set the repo Actions *variable* BEDROCK_DRIFT_ROLE_ARN to the role ARN.
#      A role ARN is not a secret, so a variable is the right home for it.

on:
  schedule:
    - cron: '0 9 * * 1'   # Mondays 09:00 UTC
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # peter-evans/create-pull-request writes the branch
      pull-requests: write   # …and opens the PR
      id-token: write        # …and OIDC needs to mint a token for AWS
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.BEDROCK_DRIFT_ROLE_ARN }}
          aws-region: us-east-1

      - name: Run drift checker with --write
        run: npm run check:bedrock-models -- --write

      - name: Open PR if manifest changed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore(bedrock): auto-mark legacy models deprecated'
          title: 'chore(bedrock): mark legacy models deprecated per AWS lifecycle'
          body: |
            AWS Bedrock has marked one or more models in our manifest as
            `LEGACY`. This PR flags them `deprecated: true`.

            Generated by `.github/workflows/check-bedrock-models.yml`.
            Review the diff and merge if correct.
          branch: chore/bedrock-model-deprecations
          delete-branch: true
          labels: automated,dependencies
